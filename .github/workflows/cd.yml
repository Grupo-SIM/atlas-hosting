name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  detect:
    name: Detect affected
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.affected.outputs.tasks }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Compute affected services
        id: affected
        uses: hyoretsu/gh-actions/detect-affected@main
        with:
          tasks: build
          base-sha: ${{ github.event.before }}

  ghcr:
    name: Build and publish ${{ matrix.service }} image
    needs: detect
    if: ${{ fromJSON(needs.detect.outputs.tasks).build[0] }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.tasks).build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build and publish image
        uses: hyoretsu/gh-actions/containers@main
        with:
          image: ${{ github.repository }}_${{ matrix.service }}
          dockerfile: ${{ matrix.service }}/Dockerfile
          build-args: |
            NODE_ENV=production
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io


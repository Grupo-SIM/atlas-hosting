name: atlas-hosting-production
x-after-migrate: &after-migrate
  depends_on:
    migrate:
      condition: service_completed_successfully
services:
  migrate:
    image: ${MIGRATE_IMAGE:-ghcr.io/grupo-sim/atlas-hosting_migrate:latest}
    env_file: .env
    init: true
    networks: [externa]
    restart: "no"
    working_dir: /app/frontend
    command: ["bun", "run", "migrate:deploy"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  frontend:
    <<: *after-migrate
    image: ${FRONTEND_IMAGE:-ghcr.io/grupo-sim/atlas-hosting_frontend:latest}
    env_file: .env
    init: true
    networks: [externa]
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
  # Atlas IA do Criador de Sites: guarda o login Claude de cada usuário (assinatura dele) e roda o
  # Claude Code. Fica de propósito SEM `env_file: .env` (não pode enxergar banco, chaves nem segredos do
  # app) e sem chave de API: só o token abaixo. O volume guarda os logins; não use `down -v`.
  claude-worker:
    image: ${CLAUDE_WORKER_IMAGE:-ghcr.io/grupo-sim/atlas-hosting_claude-worker:latest}
    environment:
      CLAUDE_WORKER_TOKEN: ${CLAUDE_WORKER_TOKEN:-}
    init: true
    networks: [externa]
    restart: unless-stopped
    volumes: [claude-state:/state/claude]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
networks:
  externa:
    external: true
volumes:
  claude-state:

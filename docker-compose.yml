        --header="Authorization: Bearer $$CRON_SECRET"
        https://atlashosting.com.br/api/internal/domain-payments/reconcile;
        wget -q -O- --post-data=''
        --header="Authorization: Bearer $$CRON_SECRET"
        https://atlashosting.com.br/api/internal/namecheap-verification;
        sleep 300;
        done
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

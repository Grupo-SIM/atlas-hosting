  # Único agendador da renovação de assinaturas VPS. O app não agenda mais nada
  # internamente (ver instrumentation-node.ts).
  # Amostra a cada 30min e dispara na hora cheia alvo; 11h UTC = 08h em Fortaleza
  # (UTC-3, sem horário de verão). O container roda em UTC de propósito — sem
  # tzdata, TZ nomeado seria ignorado silenciosamente.
  vps-cron:
    image: alpine:latest
    networks:
      - externa
    environment:
      - CRON_SECRET=EUt18pjzZD6z
    command:
      - sh
      - -c
      - >-
        while true; do
        [ "$$(date -u +%H)" = "11" ] && wget -q -O- --post-data=''
        --header="Authorization: Bearer $$CRON_SECRET"
        https://atlashosting.com.br/api/internal/vps-subscriptions/renew;
        sleep 1800;
        done
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
  expiry-notifications-cron:
    image: alpine:latest
    networks:
      - externa
    environment:
      - CRON_SECRET=EUt18pjzZD6z

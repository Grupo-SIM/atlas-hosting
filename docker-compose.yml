---
version: "2.1"
services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: atlas-hosting-postgres
    environment:
      - POSTGRES_USER=atlas
      - POSTGRES_PASSWORD=atlas123
      - POSTGRES_DB=atlas_hosting
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas"]
      interval: 10s
      timeout: 5s
      retries: 5

  swag:
    image: lscr.io/linuxserver/swag
    container_name: swag
    cap_add:
      - NET_ADMIN
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Fortaleza
      - URL=coolify.atlashosting.com.br
      # - SUBDOMAINS=www,
      - VALIDATION=http
      # - CERTPROVIDER= #optional
      - DNSPLUGIN=cloudflare #optional
      - EMAIL=lucasgarrafielo@gmail.com #optional
      - ONLY_SUBDOMAINS=false #optional
      # - EXTRA_DOMAINS=<extradomains> #optional
      - STAGING=false #optional
    volumes:
      - ./.config/swag:/config
    ports:
      - 443:443
      - 80:80
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
